name: CI

# The gate every change to the runtime passes: formatting, lints, tests and a
# release-shaped binary build. The toolchain matches the release pipeline, so
# a lint that is clean here is clean when a release is cut.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.98.1

jobs:
  check:
    name: Format, lint, test, build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ env.RUST_VERSION }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build celld
        run: cargo build --bin celld
