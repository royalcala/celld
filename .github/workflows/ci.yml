name: CI

# The gate every change to the runtime passes: formatting, lints, tests and a
# release-shaped binary build. The toolchain matches the release pipeline, so
# a lint that is clean here is clean when a release is cut.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.98.1

jobs:
  check:
    name: Format, lint, test, build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ env.RUST_VERSION }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build celld
        run: cargo build --bin celld

  two-node:
    name: Two-node fleet (S3)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # The vendored us-s3gw (tools/s3gw) is the local S3-compatible endpoint:
    # same s3s code path as MinIO, conditional writes serialized by a single
    # CAS lock, and metadata filenames hashed so celld's long facet-log keys
    # stay under NAME_MAX. Its acceptance script runs celld diagnose and a
    # concurrent If-None-Match race before the fleet matrix.
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-two-node-${{ env.RUST_VERSION }}

      - name: Build celld and the S3 gateway
        run: |
          set -euo pipefail
          cargo build --bin celld
          cargo build --release --manifest-path tools/s3gw/Cargo.toml
          cargo fmt --manifest-path tools/s3gw/Cargo.toml -- --check

      - name: Install esbuild
        run: npm install --global esbuild

      - name: S3 gateway acceptance (conditional writes + CAS race)
        env:
          CELLD_BIN: ${{ github.workspace }}/target/debug/celld
          S3GW_BIN: ${{ github.workspace }}/tools/s3gw/target/release/us-s3gw
          S3GW_PORT: "9020"
        run: |
          set -euo pipefail
          bash tools/s3gw/scripts/accept.sh
          bash tools/s3gw/scripts/race.sh

      - name: Two-node matrix
        env:
          S3GW_BIN: ${{ github.workspace }}/tools/s3gw/target/release/us-s3gw
        run: |
          set -euo pipefail
          mkdir -p /tmp/s3gw-data/celld-fleet
          "$S3GW_BIN" --host 127.0.0.1 --port 9000 \
            --access-key minioadmin --secret-key minioadmin /tmp/s3gw-data &
          for _ in $(seq 1 80); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            [ -n "$code" ] && [ "$code" != "000" ] && break
            sleep 0.25
          done
          S3_ENDPOINT=http://127.0.0.1:9000 S3_BUCKET=celld-fleet \
            S3_LOCAL_ROOT=/tmp/s3gw-data \
            CELLD_BIN=target/debug/celld CELLD_ESBUILD="$(command -v esbuild)" \
            bash scripts/e2e-2node.sh
