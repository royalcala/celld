[package]
name = "us-s3gw"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "S3 gateway with a provable CAS, for celld fleet buckets (derived from s3s-fs, Apache-2.0)"

[features]
# Upstream s3s-fs gates the internal-error span-trace log (`src/error.rs`) behind
# its `binary` feature. us-s3gw always ships the binary, so it is on by default;
# declaring it also silences `unexpected_cfgs` (clippy clean).
binary = []
default = ["binary"]

[lib]
name = "us_s3gw"
path = "src/lib.rs"

[[bin]]
name = "us-s3gw"
path = "src/main.rs"

[dependencies]
s3s = "0.14.1"
async-trait = "0.1"
base64-simd = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
futures = { version = "0.3", default-features = false }
hex-simd = "0.8"
hyper = { version = "1", features = ["http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
mime = "0.3"
numeric_cast = "0.3"
path-absolutize = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
std-next = "0.1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
transform-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
